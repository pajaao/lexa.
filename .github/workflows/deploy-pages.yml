name: Publicar Lexa no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexa-github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar pacote estático
        run: npm run build:pages
      - name: Testar a aplicação
        run: npm test
      - name: Testar importadores e monitores sem consultar a rede
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Guardar pacote para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site validado
        id: deployment
        uses: actions/deploy-pages@v4
