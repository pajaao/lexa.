name: Verificar fontes da legislação

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-legislation.yml'
      - 'scripts/check_official_sources.py'
      - 'scripts/official_http.py'
      - 'scripts/test_monitor.py'
      - 'scripts/import_official.py'
      - 'scripts/test_import_official.py'
      - 'scripts/search.test.js'
      - 'scripts/build.mjs'
      - 'official-sumulas.js'
      - 'sumulas-updates.js'
      - 'scripts/build.test.js'
      - 'sumulas-content.js'
      - 'scripts/sumulas.test.js'
      - 'scripts/import_sumulas.py'
      - 'scripts/test_sumulas.py'
      - 'sources/sumulas-manifest.json'
      - 'style.css'
      - 'scripts/index.template.html'
      - 'data.js'
      - 'app.js'
      - 'history.js'
      - 'scripts/history.test.js'
      - 'monitor/sources.json'
  schedule:
    - cron: '17 9 * * *' # 06:17 em São Paulo (UTC-3); horários do GitHub são aproximados.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lexa-official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar cliente HTTPS
        run: curl --version
      - name: Testar o monitor
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Consultar as seis fontes
        id: check
        run: python scripts/check_official_sources.py --github-output "$GITHUB_OUTPUT"
      - name: Preparar textos candidatos para o leitor
        run: python scripts/import_official.py
      - name: Validar textos e gerar a prévia
        run: |
          npm run build
          npm test
      - name: Guardar evidências e diferenças
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-legislacao-${{ github.run_id }}
          path: monitor/run/
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar prévia da atualização
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: previa-legislacao-${{ github.run_id }}
          path: index.html
          retention-days: 30
      - name: Propor revisão da referência monitorada
        # Also run after an unchanged capture so a proposal whose changes were
        # reverted upstream can be closed instead of remaining stale.
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/official-source-review
          commit-message: 'Preparar textos e coleta das fontes oficiais para revisão'
          title: 'Revisar atualização dos textos da legislação'
          body-path: monitor/run/pr-body.md
          add-paths: |
            monitor/official/*.json
            official-content.js
            updates.js
            sources/official-manifest.json
            index.html
          delete-branch: true
          draft: true
