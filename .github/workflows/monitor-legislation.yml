name: Verificar fontes da legislação

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-legislation.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'data/archive/**'
      - 'data/official/sumulas.js'
      - 'data/history/sumulas.js'
      - 'sources/sumulas-manifest.json'
      - 'monitor/sources.json'
  schedule:
    - cron: '17 9 * * *' # 06:17 em São Paulo (UTC-3); horários do GitHub são aproximados.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lexa-official-source-monitor
  cancel-in-progress: false

jobs:
  alternate-linux-network:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir a mesma fonte no executor alternativo
        run: python scripts/diagnose_official_network.py --output monitor/run/network-diagnostic.json
  windows-network:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The repository name ends in a dot, which Windows normalizes away.
      # No checkout is necessary for a read-only native HTTPS probe.
      - name: Consultar a fonte pelo cliente nativo do Windows
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $probeBody = Join-Path $env:RUNNER_TEMP 'lexa-source-body.txt'
          $probeHeaders = Join-Path $env:RUNNER_TEMP 'lexa-source-headers.txt'
          curl.exe --version
          $probeResult = & curl.exe --disable --silent --show-error --http1.1 --compressed --proto '=https' --connect-timeout 8 --max-time 25 --max-filesize 12582912 --user-agent 'Mozilla/5.0 (compatible; Lexa/0.1; public legislation research)' --header 'Accept: text/html,application/xhtml+xml' --output $probeBody --dump-header $probeHeaders --write-out '%{json}' 'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'
          $probeExit = $LASTEXITCODE
          $probeResult | ConvertFrom-Json | Select-Object http_code,remote_ip,http_version,ssl_verify_result,size_download,content_type | ConvertTo-Json -Compress
          Write-Output "curl_exit=$probeExit"
          if (Test-Path -LiteralPath $probeHeaders) { Get-Content -LiteralPath $probeHeaders | Select-String '^(HTTP/|Server:|Location:|Content-Type:|Content-Length:)' }
          if (Test-Path -LiteralPath $probeBody) { Write-Output "body_bytes=$((Get-Item -LiteralPath $probeBody).Length)" }
  network-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparar DNS e HTTPS sem seguir redirecionamentos
        run: python scripts/diagnose_official_network.py --output monitor/run/network-diagnostic.json
      - name: Comparar cliente HTTPS independente sem seguir redirecionamentos
        run: node scripts/diagnose_official_https.mjs
      - name: Conferir sessão e revalidação na mesma origem oficial
        run: python scripts/diagnose_official_session.py
      - name: Guardar diagnóstico isolado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-rede-${{ github.run_id }}
          path: monitor/run/network-diagnostic.json
          retention-days: 7
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar cliente HTTPS
        run: curl --version
      # A suíte Python também verifica propostas de emendas pelo DOM independente.
      # Prepare o mesmo Chromium fixado usado no CI antes de executar esses testes.
      - uses: ./.github/actions/setup-browser
      - name: Testar o monitor
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Consultar as fontes configuradas
        id: check
        run: python scripts/check_official_sources.py --github-output "$GITHUB_OUTPUT"
      - name: Preparar textos candidatos para o leitor
        run: python scripts/import_official.py
      - name: Validar textos e gerar a prévia
        run: npm test
      - name: Guardar evidências e diferenças
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-legislacao-${{ github.run_id }}
          path: monitor/run/
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar prévia da atualização
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: previa-legislacao-${{ github.run_id }}
          path: dist/
          retention-days: 30
      - name: Propor revisão da referência monitorada
        # Also run after an unchanged capture so a proposal whose changes were
        # reverted upstream can be closed instead of remaining stale.
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/official-source-review
          commit-message: 'Preparar textos e coleta das fontes oficiais para revisão'
          title: 'Revisar atualização dos textos da legislação'
          body-path: monitor/run/pr-body.md
          add-paths: |
            monitor/official/*.json
            data/official/legislation.js
            data/history/legislation.js
            sources/official-manifest.json
          delete-branch: true
          draft: true
