name: Preparar Chromium de testes
description: Instala o Playwright fixado e o Chromium correspondente, sem dependências npm.
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install -r scripts/requirements-browser.txt
    - shell: bash
      run: python -m playwright install --with-deps chromium
    - shell: bash
      run: |
        python - <<'PY'
        import os
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            with open(os.environ['GITHUB_ENV'], 'a') as env:
                env.write('LEXA_CHROMIUM=' + p.chromium.executable_path + '\n')
        PY
